<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Standard Issue hero exploration A: a modernist direction for BRAND-001."
    />
    <title>Standard Issue — modernist hero exploration</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="modernist.css" />
  </head>
  <body class="mod">
    <main class="mod-hero">
      <p class="mod-brand">Standard Issue</p>
      <div class="mod-copy">
        <h1 class="mod-headline">
          <span class="mod-line-quiet">A white T-shirt</span>
          <span class="mod-line-loud">is a white T-shirt.</span>
        </h1>
        <p class="mod-support">But it'll be a good white T-shirt.</p>
        <a class="mod-action" href="../index.html#product-form"
          >Choose your size</a
        >
      </div>
      <img
        class="mod-shirt"
        src="../assets/white-shirt.svg"
        alt="Plain white, unbranded short-sleeved T-shirt"
        width="800"
        height="880"
      />
      <dl class="mod-facts">
        <div>
          <dt>Color</dt>
          <dd>White</dd>
        </div>
        <div>
          <dt>Sizes</dt>
          <dd>S, M, L, XL</dd>
        </div>
        <div>
          <dt>Price</dt>
          <dd>$28, fictional demo price</dd>
        </div>
      </dl>
    </main>
    <footer class="mod-footer">
      <p>Hero exploration for BRAND-001. Not the live store.</p>
      <a href="postmodernist.html">Compare the other preview</a>
    </footer>
  </body>
</html>
