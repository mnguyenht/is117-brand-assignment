<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Standard Issue hero exploration B: a postmodernist direction for BRAND-001."
    />
    <title>Standard Issue — postmodernist hero exploration</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="postmodernist.css" />
  </head>
  <body class="pomo label-try">
    <main class="pomo-hero">
      <div class="pomo-bars" aria-hidden="true"></div>
      <p class="pomo-brand">Standard Issue</p>
      <div class="pomo-copy">
        <h1 class="pomo-headline">
          <span class="pomo-strip">A white T-shirt</span>
          <span class="pomo-strip pomo-strip-shift">is a white T-shirt.</span>
        </h1>
        <p class="pomo-support">But it'll sure be a great white T-shirt.</p>
        <a class="pomo-action" href="../index.html#product-form"
          >Choose your size</a
        >
      </div>
      <div class="pomo-photo">
        <img
          class="pomo-shirt"
          src="shirt-cutout.svg"
          alt="Plain white, unbranded short-sleeved T-shirt"
          width="800"
          height="880"
        />
      </div>
      <dl class="pomo-facts">
        <div>
          <dt>Contents</dt>
          <dd>1 white T-shirt</dd>
        </div>
        <div>
          <dt>Color</dt>
          <dd>White</dd>
        </div>
        <div>
          <dt>Sizes</dt>
          <dd>S, M, L, XL</dd>
        </div>
        <div>
          <dt>Price</dt>
          <dd>$28, fictional demo price</dd>
        </div>
      </dl>
    </main>
    <footer class="pomo-footer">
      <p>Hero exploration for BRAND-001. Not the live store.</p>
      <a href="modernist.html">Compare the other preview</a>
    </footer>
  </body>
</html>
