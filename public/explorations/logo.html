<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Standard Issue wordmark review for BRAND-001: navigation size, large size and one color."
    />
    <title>Standard Issue — logo review</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="logo.css" />
  </head>
  <body>
    <main class="logo-review">
      <h1>Standard Issue wordmark review</h1>

      <section aria-labelledby="nav-size">
        <h2 id="nav-size">Navigation size (175 × 30 px) on kraft</h2>
        <div class="logo-sample logo-kraft">
          <img
            src="../assets/standard-issue-wordmark.svg"
            alt="Standard Issue"
            width="175"
            height="30"
          />
        </div>
      </section>

      <section aria-labelledby="small-size">
        <h2 id="small-size">Smallest test (117 × 20 px) on white</h2>
        <div class="logo-sample logo-white">
          <img
            src="../assets/standard-issue-wordmark.svg"
            alt="Standard Issue"
            width="117"
            height="20"
          />
        </div>
      </section>

      <section aria-labelledby="large-size">
        <h2 id="large-size">Large (560 × 96 px), one color</h2>
        <div class="logo-sample logo-white">
          <img
            src="../assets/standard-issue-wordmark.svg"
            alt="Standard Issue"
            width="560"
            height="96"
          />
        </div>
      </section>

      <p>
        The artwork uses one ink color (#111) throughout, so the same file is
        the one-color version. <a href="postmodernist.html">Back to preview</a>
      </p>
    </main>
  </body>
</html>
