<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="intro-gate.js"></script>
    <meta
      name="description"
      content="Account and orders for the Standard Issue demo store."
    />
    <title>Account — Standard Issue</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="store.css" />
    <link rel="stylesheet" href="effects.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a
        class="brand-link"
        href="index.html"
        aria-label="Standard Issue storefront home"
      >
        <img
          class="wordmark"
          src="assets/standard-issue-wordmark.svg"
          alt="Standard Issue"
          width="210"
          height="36"
        />
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Shop</a>
        <a class="nav-link" href="styleguide.html">Style guide</a>
        <a class="nav-link" href="studio.html"
          >Studio <span aria-hidden="true">↗</span></a
        >
        <a
          id="account-link"
          class="nav-link"
          href="account.html"
          aria-current="page"
          >Account</a
        >
      </nav>
      <a
        class="bag-link"
        href="index.html#demo-bag"
        aria-label="Demo bag, 0 items"
        >Demo bag <span id="bag-count" class="bag-count">0</span></a
      >
    </header>
    <main id="main" class="store-page wrap">
      <p class="eyebrow">Account</p>
      <h1><span class="label-tape">Your account.</span></h1>
      <p id="account-status" role="status"></p>
      <div id="account-content"></div>
    </main>
    <aside class="starter-notice" aria-label="Demo information">
      <span
        ><strong>Demo store.</strong> A classroom project with fictional product
        data. Nothing is sold here.</span
      >
      <a href="studio.html">Studio brief <span aria-hidden="true">↗</span></a>
    </aside>
    <footer class="site-footer wrap">
      <p>
        Standard Issue <span class="footer-separator"> / </span> IS117 Brand
        Studio demo
      </p>
      <a href="https://github.com/kaw393939/is117-brand-studio#readme"
        >Project README <span aria-hidden="true">↗</span></a
      >
    </footer>
    <script type="module" src="js/account-page.js"></script>
  </body>
</html>
